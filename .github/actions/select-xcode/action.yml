name: Select the latest Xcode
description: Switches to the newest stable Xcode installed on the runner.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
        xcodebuild -version
        swift --version
