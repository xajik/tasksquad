name: Native macOS

on:
  pull_request:
    paths:
      - 'packages/macos/**'
      - 'packages/daemon/**'
      - 'packages/mobile/**'
      - '.github/workflows/macos-native.yml'
  push:
    branches: [main]
    paths:
      - 'packages/macos/**'
      - 'packages/daemon/**'
      - 'packages/mobile/**'
      - '.github/workflows/macos-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
      - name: Install terminal test dependency
        run: command -v tmux || brew install tmux
      - name: Test shared portal package (stores, operations, design resources, renders)
        working-directory: packages/mobile/TaskSquadPortal
        run: swift test
      - name: Test native implementation against Go
        run: make test-compatibility
      - name: Render native UI components
        run: make test-ui
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-renders
          path: packages/macos/.build/ui-artifacts/*.png
      - name: Build and check universal application
        run: make app-check
      - name: Test installation in an isolated directory
        env:
          APP_DIR: ${{ runner.temp }}/TaskSquadInstall
        run: |
          make install
          "$APP_DIR/TaskSquad Native.app/Contents/MacOS/TaskSquad" --version
          "$APP_DIR/TaskSquad Native.app/Contents/MacOS/TaskSquad" --check-config Tests/TaskSquadCoreTests/Fixtures/full.toml
      - name: Package development artifact
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: TaskSquad-native-development
          path: |
            packages/macos/dist/TaskSquad-Native-*.dmg
            packages/macos/dist/TaskSquad-Native-*.dmg.sha256

  intel:
    # Intel runtime: the full Go-differential suite and the standalone CLI on x86_64.
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
      - name: Install terminal test dependency
        run: command -v tmux || brew install tmux
      - name: Test native implementation against Go (x86_64)
        run: |
          test "$(uname -m)" = x86_64
          # Hosted Intel VMs expose no Metal device architecture, so offscreen
          # SwiftUI renders abort in MTLLoader; the arm64 job covers UI renders.
          make test-compatibility TEST_FLAGS="--skip TaskSquadUITests"
      - name: Build and run the standalone tsq CLI (x86_64)
        run: |
          swift build -c release --product tsq
          bin=$(swift build -c release --show-bin-path)
          file "$bin/tsq" | grep -q x86_64
          "$bin/tsq" --version
          "$bin/tsq" -h 2>&1 | head -5
