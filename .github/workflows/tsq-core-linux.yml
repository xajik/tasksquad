name: tsq-core Linux

# tsq-core is the same source on macOS and Linux; packages/linux adds the Linux
# platform layer and the Linux `tsq`. Keeps both compiling (and the binary
# starting) so macOS work cannot silently break the port.

on:
  pull_request:
    paths:
      - 'packages/tsq-core/**'
      - 'packages/linux/**'
      - 'packages/mobile/TaskSquadPortal/Package.swift'
      - 'packages/mobile/TaskSquadPortal/Sources/TaskSquadPortalAPI/**'
      - '.github/workflows/tsq-core-linux.yml'
  push:
    branches: [main]
    paths:
      - 'packages/tsq-core/**'
      - 'packages/linux/**'
      - 'packages/mobile/TaskSquadPortal/Package.swift'
      - 'packages/mobile/TaskSquadPortal/Sources/TaskSquadPortalAPI/**'
      - '.github/workflows/tsq-core-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsq-core-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Build TaskSquadCore + TaskSquadCLI
        run: swift build --package-path packages/tsq-core
      - name: Build Linux tsq
        run: swift build --package-path packages/linux --product tsq
      - name: Smoke-run Linux tsq
        run: |
          bin="$(swift build --package-path packages/linux --show-bin-path)/tsq"
          "$bin" --version

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends tmux curl python3 procps
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
          cache: false
      - name: Build Go reference oracle
        working-directory: packages/daemon
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          CGO_ENABLED=0 go build -buildvcs=false -o "$RUNNER_TEMP/reference/go-daemon" ../tsq-core/Tests/GoReference/main.go
          CGO_ENABLED=0 go build -buildvcs=false -o "$RUNNER_TEMP/reference/tsq" .
      - name: Shared tsq-core tests on LinuxPlatform
        run: |
          TSQ_GO_ORACLE="$RUNNER_TEMP/reference/go-daemon" TSQ_GO_TSQ="$RUNNER_TEMP/reference/tsq" \
            swift test --package-path packages/linux
