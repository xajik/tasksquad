name: Release Daemon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: packages/daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  macos-app:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build unsigned .app
        working-directory: packages/daemon
        run: |
          ./scripts/generate-icon.sh
          VERSION="${GITHUB_REF_NAME}" ./scripts/build-macos-app.sh

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f cert.p12

      - name: Codesign
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements packages/daemon/scripts/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            packages/daemon/dist/TaskSquad.app
          codesign --verify --deep --strict --verbose=2 packages/daemon/dist/TaskSquad.app

      - name: Notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > AuthKey.p8
          cd packages/daemon/dist
          ditto -c -k --keepParent TaskSquad.app TaskSquad.zip
          xcrun notarytool submit TaskSquad.zip \
            --key ../../../AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple TaskSquad.app
          rm -f TaskSquad.zip
          cd -
          rm -f AuthKey.p8

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type execute -vv packages/daemon/dist/TaskSquad.app

      - name: Build DMG
        run: |
          cd packages/daemon/dist
          rm -rf dmg-root
          mkdir dmg-root
          cp -R TaskSquad.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname TaskSquad -srcfolder dmg-root -ov -format UDZO \
            "TaskSquad-${GITHUB_REF_NAME#v}.dmg"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" packages/daemon/dist/TaskSquad-*.dmg --clobber
