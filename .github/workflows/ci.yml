name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: make test
        working-directory: packages/daemon

  test-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test native daemon and DMG installation
        run: make test-native app app-dmg app-check app-cask-check VERSION=v0.0.0
        working-directory: packages/daemon
      - name: Keep unsigned test installer
        uses: actions/upload-artifact@v4
        with:
          name: TaskSquad-macos-unsigned
          path: |
            packages/daemon/dist/TaskSquad-0.0.0.dmg
            packages/daemon/dist/TaskSquad-0.0.0.dmg.sha256
          if-no-files-found: error

  test-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make install
        working-directory: packages/portal
      - run: make test
        working-directory: packages/portal

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make install
        working-directory: packages/worker
      - run: make test
        working-directory: packages/worker
