name: Native macOS release

# Builds an explicitly marked development preview. Preview releases are separate
# from stable downloads; stable releases require Developer ID and notarization.
# and publishes the DMG as a `macos-v*` GitHub release. The website links to
# https://api.tasksquad.ai/download/macos, which redirects to the newest published
# one. Releases are never marked "Latest": install.sh resolves the Go daemon via
# /releases/latest and must keep pointing at a `v*` tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native version (X.Y.Z, or X.Y.Z-preview.N for a prerelease)'
        required: true
        type: string
      draft:
        description: 'Create as draft (not downloadable from the website until published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-native-release
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: packages/macos
    steps:
      - uses: actions/checkout@v4
      - name: Select the latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
      - name: Install terminal test dependency
        run: command -v tmux || brew install tmux
      - name: Validate version and test
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || { echo 'Expected X.Y.Z-preview.N'; exit 1; }
          make test-compatibility app-check
      - name: Check signing credentials
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Previews can be unsigned, but are visibly marked as development builds.
          if [[ -n "$MACOS_CERTIFICATE_P12_BASE64" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGNING_IDENTITY" \
                && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY_P8" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are missing — publishing an unsigned, unnotarized development preview."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import Developer ID and notarization credentials
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY_ID:?Missing Apple API key ID}"
          : "${APPLE_API_ISSUER:?Missing Apple issuer}"
          : "${APPLE_API_KEY_P8:?Missing Apple API key}"
          umask 077
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/tasksquad-native.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/native-cert.p12"
          security import "$RUNNER_TEMP/native-cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/NativeAuthKey.p8"
          xcrun notarytool store-credentials tasksquad-native-preview --keychain "$keychain" \
            --key "$RUNNER_TEMP/NativeAuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
      - name: Sign, notarize, staple, and package
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: tasksquad-native-preview
          NOTARY_KEYCHAIN: ${{ runner.temp }}/tasksquad-native.keychain-db
        run: make app-signed package
      - name: Package ad-hoc-signed preview
        if: steps.signing.outputs.available != 'true'
        run: |
          make app package
          printf '\n> **Unsigned development preview; not notarized. Do not use this build for stable distribution.**\n' >> PREVIEW.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          tag="macos-v$VERSION"
          flags=(--latest=false)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && flags+=(--draft)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "TaskSquad Native $VERSION" --notes-file PREVIEW.md \
            "dist/TaskSquad-Native-$VERSION.dmg" "dist/TaskSquad-Native-$VERSION.dmg.sha256"
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/native-cert.p12" "$RUNNER_TEMP/NativeAuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/tasksquad-native.keychain-db" || true
