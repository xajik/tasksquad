name: Native macOS stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable native version (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-native-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: packages/macos
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/daemon/go.mod
      - name: Install terminal test dependency
        run: command -v tmux || brew install tmux
      - name: Validate version and qualify compatibility
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected X.Y.Z'; exit 1; }
          make test-compatibility app-check
      - name: Require signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing Developer ID certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${MACOS_SIGNING_IDENTITY:?Missing Developer ID identity}"
          : "${APPLE_API_KEY_ID:?Missing Apple API key ID}"
          : "${APPLE_API_ISSUER:?Missing Apple issuer}"
          : "${APPLE_API_KEY_P8:?Missing Apple API key}"
          umask 077
          keychain_password=$(uuidgen)
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/tasksquad-native-stable.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/native-stable-cert.p12"
          security import "$RUNNER_TEMP/native-stable-cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/NativeStableAuthKey.p8"
          xcrun notarytool store-credentials tasksquad-native-stable --keychain "$keychain" \
            --key "$RUNNER_TEMP/NativeStableAuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
      - name: Sign, notarize, staple, and package
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: tasksquad-native-stable
          NOTARY_KEYCHAIN: ${{ runner.temp }}/tasksquad-native-stable.keychain-db
        run: make app-signed package
      - name: Build, sign, and notarize the standalone tsq CLI
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEYCHAIN: ${{ runner.temp }}/tasksquad-native-stable.keychain-db
        run: |
          set -euo pipefail
          make cli
          lipo -verify_arch arm64 x86_64 dist/cli/tsq
          ditto -c -k dist/cli/tsq dist/tsq-notarization.zip
          xcrun notarytool submit dist/tsq-notarization.zip --keychain-profile tasksquad-native-stable \
            --keychain "$NOTARY_KEYCHAIN" --wait
      - name: Verify signed artifact and prepare release notes
        run: |
          set -euo pipefail
          lipo -verify_arch arm64 x86_64 dist/TaskSquad.app/Contents/MacOS/TaskSquad
          xcrun stapler validate dist/TaskSquad.app
          spctl --assess --type execute -vv dist/TaskSquad.app
          codesign --verify --deep --strict --verbose=2 dist/TaskSquad.app
          printf '# TaskSquad Native %s\n\nSigned with Developer ID, notarized, stapled, and Gatekeeper-checked.\n' "$VERSION" > STABLE.md
      - name: Publish stable macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="macos-v$VERSION"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "TaskSquad Native $VERSION" --notes-file STABLE.md \
            "dist/TaskSquad-Native-$VERSION.dmg" "dist/TaskSquad-Native-$VERSION.dmg.sha256" \
            dist/tsq_Darwin_universal.tar.gz dist/tsq_Darwin_universal.tar.gz.sha256
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/native-stable-cert.p12" "$RUNNER_TEMP/NativeStableAuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/tasksquad-native-stable.keychain-db" || true
