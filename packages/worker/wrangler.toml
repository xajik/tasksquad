name = "tasksquad-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# D1
[[d1_databases]]
binding         = "DB"
database_name   = "tasksquad-db"
database_id     = "172c2b3e-3547-45e5-8a58-fa5e73b4e63d"
migrations_dir  = "migrations"

# R2
[[r2_buckets]]
binding     = "LOGS"
bucket_name = "tasksquad-logs"

# KV — Firebase JWKS cache
[[kv_namespaces]]
binding = "JWKS_CACHE"
id      = "2fd5d9c6fb734e07940c1d825c7d1411"

# KV — inbox version counter for ETag/cache-control on daemon polling
# Provision with: wrangler kv namespace create POLL_CACHE
[[kv_namespaces]]
binding = "POLL_CACHE"
id      = "60e989c16f6d4ce4946df7393a6031ce"

# KV — CLI token minting limit, 5 per user per hour (src/middleware/circuitBreaker.ts)
[[kv_namespaces]]
binding = "CB_KV"
id      = "69da9d69e08049cc863f98af59ce144a"

# Rate limiting (src/middleware/rateLimit.ts), keyed by client IP and counted per
# Cloudflare location. Applies on every hostname the worker serves, workers.dev included.
# Generous cap on all traffic — stops floods and id enumeration, not normal use.
[[ratelimits]]
name         = "IP_LIMITER"
namespace_id = "1001"
simple       = { limit = 3000, period = 60 }

# Strict cap on sign-in and token endpoints.
[[ratelimits]]
name         = "AUTH_LIMITER"
namespace_id = "1002"
simple       = { limit = 20, period = 60 }

# Failed authentications per IP; past the limit, further failures answer 429.
[[ratelimits]]
name         = "AUTH_FAIL_LIMITER"
namespace_id = "1003"
simple       = { limit = 10, period = 60 }

# Durable Object migration — remove AgentRelay class (relay removed in security refactor)
[[migrations]]
tag = "v2"
deleted_classes = ["AgentRelay"]

# Durable Object migration — add TerminalRelay for live terminal streaming
[[migrations]]
tag = "v3"
new_classes = ["TerminalRelay"]

[[durable_objects.bindings]]
name = "TERMINAL_RELAY"
class_name = "TerminalRelay"

# OAuth callbacks of the TaskSquad MCP server (packages/mcp) allowed to receive
# /mobile/authorization codes. Exact match, comma-separated.
[vars]
MCP_REDIRECT_URIS = "https://tasksquad-mcp.xajik0.workers.dev/oauth/callback,https://tasksquad.ai/oauth/callback,http://localhost:8788/oauth/callback"

[observability]
enabled = true

# Memory rollups (src/cron/rollup.ts) — fires hourly; the handler itself decides
# whether it's time to materialize a new daily/weekly memory_rollup per team.
[triggers]
crons = ["0 * * * *"]

# CORS — set to a comma-separated list of allowed origins
# e.g. "https://tasksquad.ai,http://localhost:5173"
# Configure via: wrangler secret put ALLOWED_ORIGINS
# [vars]
# ALLOWED_ORIGINS = ""
