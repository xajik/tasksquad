<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskSquad — Voice to MD</title>
<style>
:root {
  --bg:         #F6F7F9;
  --card:       #FFFFFF;
  --ink:        #0F1117;
  --muted:      #6B7280;
  --border:     #E2E4EA;
  --accent:     #2563EB;
  --green:      #16A34A;
  --amber:      #D97706;
  --red:        #DC2626;
  --radius:     6px;
  --font-mono:  "JetBrains Mono", "Menlo", "Monaco", ui-monospace, monospace;
  --font-sans:  "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  background: var(--bg);
  color: var(--ink);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────── */
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.logo-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
.header-title { font-weight: 600; font-size: 15px; }
.header-spacer { flex: 1; }
.state-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
}
.state-badge.recording { background: #FEF2F2; border-color: var(--red); color: var(--red); }
.state-badge.processing { background: #FFF7ED; border-color: var(--amber); color: var(--amber); }
.state-badge.ready { background: #F0FDF4; border-color: var(--green); color: var(--green); }

/* ── Setup Panel (shown when not yet initialised) ────────────────────── */
#setup-panel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.setup-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.setup-card h2 { font-size: 16px; font-weight: 600; }
.form-row { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
select, input {
  height: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px;
  font-size: 14px;
  font-family: var(--font-sans);
  background: var(--card);
  color: var(--ink);
  outline: none;
}
select:focus, input:focus { border-color: var(--accent); }

.model-row { display: flex; align-items: center; gap: 8px; }
.model-row select { flex: 1; }
.model-status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.model-status.ok { color: var(--green); }

/* ── Buttons ─────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font-sans);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .15s, opacity .15s;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: #1d4ed8; }
.btn-danger  { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger:hover:not(:disabled)  { background: #b91c1c; }
.btn-ghost   { background: transparent; color: var(--ink); border-color: var(--border); }
.btn-ghost:hover:not(:disabled)   { background: var(--bg); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

/* Progress bar */
.progress-bar { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; background: var(--accent); transition: width .2s; }

/* ── Main session view ───────────────────────────────────────────────── */
#session-panel {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
  padding: 16px;
  gap: 12px;
}

/* Markdown panel */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  flex-shrink: 0;
}
#md-editor {
  flex: 1;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  border: none;
  resize: none;
  outline: none;
  color: var(--ink);
  background: var(--card);
}

/* Transcript panel */
#transcript-panel {
  flex-shrink: 0;
}
#transcript-body {
  max-height: 180px;
  overflow-y: auto;
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
#transcript-body .chunk { margin-bottom: 4px; }
#transcript-body .chunk.new { color: var(--ink); }

/* Controls bar */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px 0 0;
  flex-shrink: 0;
}
.record-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, background .15s;
  box-shadow: 0 4px 12px rgba(37,99,235,.35);
}
.record-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.record-btn:hover:not(:disabled) { transform: scale(1.06); }
.record-btn.recording {
  background: var(--red);
  box-shadow: 0 4px 12px rgba(220,38,38,.35);
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(220,38,38,.4); }
  70%  { box-shadow: 0 0 0 16px rgba(220,38,38,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}

/* ── Prereq warning ──────────────────────────────────────────────────── */
.prereq-warn {
  background: #FFF7ED;
  border: 1px solid var(--amber);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  color: #92400E;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.prereq-warn strong { font-weight: 600; }
.prereq-warn code { font-family: var(--font-mono); font-size: 12px; }

/* ── Init banner ─────────────────────────────────────────────────────── */
#init-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 0 4px;
  font-size: 13px;
  color: var(--muted);
}
.init-spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}

/* ── Toast ────────────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e293b;
  color: #f8fafc;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Spinner */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  display: none;
}
.spinner.show { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────── -->
<header>
  <div class="logo-dot"></div>
  <span class="header-title">Voice to MD</span>
  <span class="header-spacer"></span>
  <span id="state-badge" class="state-badge">idle</span>
</header>

<!-- ── Setup panel ────────────────────────────────────────────────────── -->
<div id="setup-panel">
  <div class="setup-card">
    <h2>New Voice Session</h2>

    <!-- Prereq warning (hidden when all OK) -->
    <div id="prereq-warn" class="prereq-warn" style="display:none"></div>

    <!-- Model selection -->
    <div class="form-row">
      <label>Whisper Model</label>
      <div class="model-row">
        <select id="model-select">
          <option value="tiny">Tiny (75 MB) — fastest</option>
          <option value="base" selected>Base (142 MB) — recommended</option>
          <option value="small">Small (466 MB)</option>
          <option value="medium">Medium (1.5 GB)</option>
          <option value="large">Large (2.9 GB)</option>
        </select>
        <span id="model-status" class="model-status">checking…</span>
      </div>
      <div class="progress-bar" id="dl-progress-bar" style="display:none">
        <div class="progress-fill" id="dl-progress-fill" style="width:0%"></div>
      </div>
      <button id="btn-download" class="btn btn-ghost btn-sm" style="display:none">
        <span id="dl-spinner" class="spinner"></span>
        Download
      </button>
    </div>

    <!-- Agent selection -->
    <div class="form-row">
      <label>Agent</label>
      <select id="agent-select">
        <option value="">Loading agents…</option>
      </select>
    </div>

    <!-- Start button -->
    <button id="btn-start-session" class="btn btn-primary" disabled>
      <span id="start-spinner" class="spinner"></span>
      Initialise Agent
    </button>
    <p id="setup-hint" style="font-size:12px;color:var(--muted)">
      Select a model (download if needed) and an agent, then click Initialise.
      Recording will enable once the agent is ready.
    </p>
  </div>
</div>

<!-- ── Session panel ──────────────────────────────────────────────────── -->
<div id="session-panel">

  <!-- Markdown panel -->
  <div class="panel" style="flex:1">
    <div class="panel-header">
      <span>Markdown</span>
      <span id="md-filename" style="font-weight:400;color:var(--muted)">new-document.md</span>
    </div>
    <textarea id="md-editor" spellcheck="false" placeholder="Processed markdown will appear here…"></textarea>
  </div>

  <!-- Transcript panel -->
  <div class="panel" id="transcript-panel">
    <div class="panel-header">
      <span>Live Transcript</span>
      <button class="btn btn-ghost btn-sm" id="btn-clear-transcript">Clear</button>
    </div>
    <div id="transcript-body"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-ghost btn-sm" id="btn-stop-session">Stop Session</button>
    <button class="record-btn" id="btn-record" disabled title="Start recording">
      <!-- Mic icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-pause" disabled>Pause</button>
  </div>

  <!-- Agent init banner -->
  <div id="init-banner" style="display:none">
    <div class="init-spinner"></div>
    <span>Waiting for agent to initialise… (~15–30 s)</span>
  </div>
</div>

<!-- ── Toast ────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let sessionState = 'idle';
let mediaRecorder = null;
let audioStream = null;
let eventSource = null;
let selectedModel = 'base';
let chunkIntervalMs = 5000;
let chunkTimer = null;

// ── DOM refs ──────────────────────────────────────────────────────────────
const setupPanel      = document.getElementById('setup-panel');
const sessionPanel    = document.getElementById('session-panel');
const stateBadge      = document.getElementById('state-badge');
const modelSelect     = document.getElementById('model-select');
const modelStatus     = document.getElementById('model-status');
const agentSelect     = document.getElementById('agent-select');
const btnStartSession = document.getElementById('btn-start-session');
const btnRecord       = document.getElementById('btn-record');
const btnPause        = document.getElementById('btn-pause');
const btnStop         = document.getElementById('btn-stop-session');
const btnDownload     = document.getElementById('btn-download');
const dlProgressBar   = document.getElementById('dl-progress-bar');
const dlProgressFill  = document.getElementById('dl-progress-fill');
const dlSpinner       = document.getElementById('dl-spinner');
const startSpinner    = document.getElementById('start-spinner');
const mdEditor        = document.getElementById('md-editor');
const mdFilename      = document.getElementById('md-filename');
const transcriptBody  = document.getElementById('transcript-body');
const btnClearTx      = document.getElementById('btn-clear-transcript');
const initBanner      = document.getElementById('init-banner');

// ── Boot ──────────────────────────────────────────────────────────────────
checkPrereqs();
loadAgents();
loadModels();
modelSelect.addEventListener('change', loadModels);

// ── Prereq check ──────────────────────────────────────────────────────────
const prereqWarn = document.getElementById('prereq-warn');
let prereqsOk = true;

async function checkPrereqs() {
  try {
    const res = await fetch('/api/voice-to-md/prereqs');
    const issues = await res.json();
    const entries = Object.values(issues || {});
    if (entries.length === 0) {
      prereqWarn.style.display = 'none';
      prereqsOk = true;
    } else {
      prereqsOk = false;
      prereqWarn.innerHTML = '<strong>Missing dependencies:</strong>' +
        entries.map(msg => `<span>• <code>${msg}</code></span>`).join('');
      prereqWarn.style.display = 'flex';
    }
    updateStartBtn();
  } catch(_) {}
}

// ── Agents ────────────────────────────────────────────────────────────────
async function loadAgents() {
  try {
    const res = await fetch('/api/voice-to-md/agents');
    const names = await res.json();
    agentSelect.innerHTML = '';
    if (!names || names.length === 0) {
      agentSelect.innerHTML = '<option value="">No agents configured</option>';
    } else {
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = n;
        agentSelect.appendChild(opt);
      });
    }
    updateStartBtn();
  } catch(e) {
    agentSelect.innerHTML = '<option value="">Failed to load agents</option>';
  }
}

// ── Models ────────────────────────────────────────────────────────────────
let modelDownloaded = false;
async function loadModels() {
  selectedModel = modelSelect.value;
  modelStatus.textContent = 'checking…';
  modelStatus.className = 'model-status';
  btnDownload.style.display = 'none';
  try {
    const res = await fetch('/api/voice-to-md/models');
    const models = await res.json();
    const m = (models || []).find(x => x.size === selectedModel);
    if (m && m.downloaded) {
      const mb = (m.bytes / 1048576).toFixed(0);
      modelStatus.textContent = `✓ ${mb} MB`;
      modelStatus.className = 'model-status ok';
      modelDownloaded = true;
      btnDownload.style.display = 'none';
    } else {
      modelStatus.textContent = 'Not downloaded';
      modelStatus.className = 'model-status';
      modelDownloaded = false;
      btnDownload.style.display = 'inline-flex';
    }
  } catch(e) {
    modelStatus.textContent = 'Error';
    modelDownloaded = false;
  }
  updateStartBtn();
}

function updateStartBtn() {
  const hasAgent = agentSelect.value !== '';
  btnStartSession.disabled = !hasAgent || !modelDownloaded || !prereqsOk;
}
agentSelect.addEventListener('change', updateStartBtn);

// ── Download model ─────────────────────────────────────────────────────────
btnDownload.addEventListener('click', async () => {
  btnDownload.disabled = true;
  dlSpinner.classList.add('show');
  dlProgressBar.style.display = 'block';
  dlProgressFill.style.width = '0%';

  const res = await fetch('/api/voice-to-md/models/download', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({model: selectedModel})
  });

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const p = JSON.parse(line.slice(6));
        if (p.error) { toast('Download failed: ' + p.error); break; }
        if (p.done)  { dlProgressFill.style.width = '100%'; break; }
        if (p.pct !== undefined) dlProgressFill.style.width = p.pct + '%';
      } catch(_) {}
    }
  }

  dlSpinner.classList.remove('show');
  btnDownload.disabled = false;
  await loadModels();
  toast('Model downloaded');
});

// ── Start session ──────────────────────────────────────────────────────────
btnStartSession.addEventListener('click', async () => {
  const agent = agentSelect.value;
  if (!agent) return;

  btnStartSession.disabled = true;
  startSpinner.classList.add('show');
  btnStartSession.textContent = ' Initialising…';
  btnStartSession.prepend(startSpinner);

  try {
    const res = await fetch('/api/voice-to-md/session/start', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({agent, model: modelSelect.value})
    });
    if (!res.ok) throw new Error(await res.text());
    showSessionPanel();
    setSessionState('initializing');
    connectSSE();
  } catch(e) {
    toast('Error: ' + e.message);
    btnStartSession.disabled = false;
  } finally {
    startSpinner.classList.remove('show');
    btnStartSession.textContent = 'Initialise Agent';
  }
});

// ── Session panel ──────────────────────────────────────────────────────────
function showSessionPanel() {
  setupPanel.style.display = 'none';
  sessionPanel.style.display = 'flex';
}

function showSetupPanel() {
  setupPanel.style.display = 'flex';
  sessionPanel.style.display = 'none';
}

// ── SSE connection ─────────────────────────────────────────────────────────
function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/voice-to-md/stream');
  eventSource.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      handleSSEEvent(ev);
    } catch(_) {}
  };
  eventSource.onerror = () => {
    setTimeout(connectSSE, 3000);
  };
}

function handleSSEEvent(ev) {
  switch(ev.type) {
    case 'state':
      setSessionState(ev.payload);
      break;
    case 'transcript':
      appendTranscript(ev.payload);
      break;
    case 'markdown':
      mdEditor.value = ev.payload;
      break;
    case 'error':
      toast('Agent error: ' + ev.payload);
      break;
  }
}

function setSessionState(state) {
  sessionState = state;
  stateBadge.textContent = state;
  stateBadge.className = 'state-badge';
  if (state === 'recording') stateBadge.classList.add('recording');
  else if (state === 'processing') stateBadge.classList.add('processing');
  else if (state === 'ready' || state === 'paused') stateBadge.classList.add('ready');

  initBanner.style.display = (state === 'initializing') ? 'flex' : 'none';

  // Update record button
  btnRecord.disabled = (state !== 'ready' && state !== 'recording' && state !== 'paused');
  if (state === 'recording') {
    btnRecord.classList.add('recording');
    btnRecord.title = 'Stop recording';
    btnPause.disabled = false;
  } else {
    btnRecord.classList.remove('recording');
    btnRecord.title = 'Start recording';
    btnPause.disabled = true;
  }
  if (state === 'stopped') {
    stopMedia();
    if (eventSource) { eventSource.close(); eventSource = null; }
    showSetupPanel();
    loadModels();
  }
}

// ── Record button ──────────────────────────────────────────────────────────
btnRecord.addEventListener('click', async () => {
  if (sessionState === 'recording') {
    await stopRecording();
  } else {
    await startRecording();
  }
});

async function startRecording() {
  const res = await fetch('/api/voice-to-md/recording/start', {method:'POST'});
  if (!res.ok) { toast(await res.text()); return; }

  try {
    audioStream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch(e) {
    toast('Microphone access denied');
    return;
  }

  startChunk();
  scheduleNextChunk();
}

// Start a fresh MediaRecorder for one chunk (no timeslice — records until .stop()).
function startChunk() {
  const mimeType = getSupportedMimeType();
  mediaRecorder = new MediaRecorder(audioStream, mimeType ? {mimeType} : {});
  mediaRecorder.ondataavailable = (evt) => {
    if (evt.data && evt.data.size > 0) sendAudioChunk(evt.data);
  };
  mediaRecorder.start();
}

// Stop current chunk, send it, then immediately start the next one.
function cycleChunk() {
  if (!audioStream || sessionState !== 'recording') return;
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop(); // fires ondataavailable with a complete, self-contained blob
  }
  startChunk();
  scheduleNextChunk();
}

function scheduleNextChunk() {
  clearTimeout(chunkTimer);
  chunkTimer = setTimeout(cycleChunk, chunkIntervalMs);
}

async function stopRecording() {
  stopMedia();
  await fetch('/api/voice-to-md/recording/pause', {method:'POST'});
}

function stopMedia() {
  clearTimeout(chunkTimer);
  chunkTimer = null;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (audioStream) {
    audioStream.getTracks().forEach(t => t.stop());
    audioStream = null;
  }
  mediaRecorder = null;
}

function getSupportedMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
}

// ── Upload audio chunk ─────────────────────────────────────────────────────
async function sendAudioChunk(blob) {
  const model = modelSelect.value || 'base';
  try {
    await fetch(`/api/voice-to-md/upload?model=${encodeURIComponent(model)}`, {
      method: 'POST',
      headers: {'Content-Type': blob.type || 'audio/webm'},
      body: blob
    });
  } catch(e) {
    console.warn('Chunk upload failed:', e);
  }
}

// ── Pause button ──────────────────────────────────────────────────────────
btnPause.addEventListener('click', async () => {
  await stopRecording();
});

// ── Stop session ──────────────────────────────────────────────────────────
btnStop.addEventListener('click', async () => {
  stopMedia();
  // Small delay so any in-flight audio upload completes before the session tears down.
  await new Promise(r => setTimeout(r, 400));
  await fetch('/api/voice-to-md/session/stop', {method:'POST'});
});

// Kill the daemon agent if the page is closed without clicking Stop.
window.addEventListener('beforeunload', () => {
  if (sessionState !== 'idle' && sessionState !== 'stopped') {
    stopMedia();
    navigator.sendBeacon('/api/voice-to-md/session/stop');
  }
});

// ── Clear transcript ──────────────────────────────────────────────────────
btnClearTx.addEventListener('click', () => { transcriptBody.innerHTML = ''; });

// ── Transcript display ────────────────────────────────────────────────────
function appendTranscript(text) {
  const div = document.createElement('div');
  div.className = 'chunk new';
  div.textContent = text;
  transcriptBody.appendChild(div);
  transcriptBody.scrollTop = transcriptBody.scrollHeight;
  // Fade to muted after 3 s
  setTimeout(() => div.classList.remove('new'), 3000);
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Restore state on load ─────────────────────────────────────────────────
(async function restoreState() {
  try {
    const res = await fetch('/api/voice-to-md/status');
    const s = await res.json();
    if (s.state && s.state !== 'idle' && s.state !== 'stopped') {
      // Session already running — reconnect
      if (s.md_path) mdFilename.textContent = s.md_path.split('/').pop();
      const mdRes = await fetch('/api/voice-to-md/content');
      const md = await mdRes.json();
      if (md.content) mdEditor.value = md.content;
      showSessionPanel();
      connectSSE();
      setSessionState(s.state);
    }
  } catch(_) {}
})();
</script>
</body>
</html>
