name: TaskSquad
options:
  bundleIdPrefix: ai.tasksquad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  TaskSquad:
    type: application
    platform: iOS
    sources:
      - path: TaskSquad
        excludes: [Info.plist]
    dependencies:
      - package: TaskSquadPortal
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tasksquad.portal
        INFOPLIST_FILE: TaskSquad/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  TaskSquadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaskSquadUITests
    dependencies:
      - target: TaskSquad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tasksquad.portal.uitests
        GENERATE_INFOPLIST_FILE: YES
packages:
  TaskSquadPortal:
    path: ../mobile/TaskSquadPortal
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
